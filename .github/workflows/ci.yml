name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asternova
          POSTGRES_USER: asternova
          POSTGRES_PASSWORD: asternova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asternova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: "False"
      DB_ENGINE: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: asternova
      POSTGRES_USER: asternova
      POSTGRES_PASSWORD: asternova
      AI_PROVIDER: demo
      DEMO_PASSWORD: AsterNova@2024

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system packages (Tesseract for OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Django system checks
        working-directory: backend
        run: python manage.py check --deploy || python manage.py check

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Seed the demo dataset
        working-directory: backend
        run: python manage.py seed_demo_data --skip-documents

      - name: Run the test suite
        working-directory: backend
        run: python manage.py test --verbosity 2

      - name: Verify the API answers with seeded data
        working-directory: backend
        run: |
          python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()
          from rest_framework.test import APIClient
          client = APIClient()
          response = client.post(
              "/api/auth/login/",
              {"identifier": "admin@asternova.demo", "password": os.environ["DEMO_PASSWORD"]},
              format="json",
          )
          assert response.status_code == 200, response.data
          token = response.data["tokens"]["access"]
          dashboard = client.get("/api/analytics/dashboard/", HTTP_AUTHORIZATION=f"Bearer {token}")
          assert dashboard.status_code == 200
          kpis = dashboard.data["kpis"]
          assert kpis["total_patients"] > 0 and kpis["total_beds"] == 350, kpis
          print("Seeded API smoke test passed:", kpis["total_patients"], "patients")
          PY

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint --if-present

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      DJANGO_DEBUG: "True"
      DB_ENGINE: sqlite
      AI_PROVIDER: demo
      DEMO_PASSWORD: AsterNova@2024

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Prepare the database
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py seed_demo_data --skip-documents

      - name: Start the backend
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 > backend.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:8000/api/auth/demo-accounts/ --timeout 60000

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
